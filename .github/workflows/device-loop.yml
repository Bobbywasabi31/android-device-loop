name: device-loop

on:
  workflow_dispatch: # manual only — cost control until auth + billing are settled

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # keep reservations short: billed while reserved
    steps:
      - uses: actions/checkout@v4

      # Official install (verified 2026-10-07; install.sh puts the binary in
      # ~/.local/bin and appends it to PATH in .bashrc):
      # - name: Install Android CLI
      #   run: |
      #     curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh -o /tmp/android-cli-install.sh
      #     bash /tmp/android-cli-install.sh
      #     echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # TODO: non-interactive auth. `android auth login` opens a browser flow
      # and has no --token/service-account flag (verified CLI 1.0.16500706).
      # Do not invent a flag — needs Alex's GCP project + auth story.
      # - name: Authenticate
      #   run: android auth login

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run device streaming smoke loop
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          APK: app/build/outputs/apk/debug/app-debug.apk
          MODEL: ${{ vars.STREAM_MODEL }} # e.g. set repo var after checking `android device remote models`
        run: bash scripts/stream-loop.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-loop-evidence
          path: artifacts/
